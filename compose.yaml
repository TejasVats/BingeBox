services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      BINGEBOX_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bingebox}
      BINGEBOX_DATABASE_USER: ${POSTGRES_USER:-bingebox}
      BINGEBOX_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-bingebox_local_password}
      BINGEBOX_REDIS_URI: redis://redis:6379
      BINGEBOX_JWT_SECRET: ${BINGEBOX_JWT_SECRET:-replace-this-local-development-secret-before-deploying}
      BINGEBOX_SMTP_HOST: mailpit
      BINGEBOX_SMTP_PORT: 1025
      BINGEBOX_SMTP_FROM: ${BINGEBOX_SMTP_FROM:-noreply@bingebox.local}
      BINGEBOX_WATCHMODE_API_KEY: ${BINGEBOX_WATCHMODE_API_KEY}
      BINGEBOX_WATCHMODE_BASE_URL: ${BINGEBOX_WATCHMODE_BASE_URL:-https://api.watchmode.com/v1}
#      BINGEBOX_GROQ_API_KEY: ${BINGEBOX_GROQ_API_KEY}
#      BINGEBOX_GROQ_BASE_URL: ${BINGEBOX_GROQ_BASE_URL:-https://api.groq.com/openai/v1}
#      BINGEBOX_GROQ_FAST_MODEL: ${BINGEBOX_GROQ_FAST_MODEL:-openai/gpt-oss-20b}
#      BINGEBOX_GROQ_ADVANCED_MODEL: ${BINGEBOX_GROQ_ADVANCED_MODEL:-openai/gpt-oss-120b}
#      BINGEBOX_LICENSED_TRAILERS_JSON: ${BINGEBOX_LICENSED_TRAILERS_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bingebox}
      POSTGRES_USER: ${POSTGRES_USER:-bingebox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bingebox_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
  redis-data: